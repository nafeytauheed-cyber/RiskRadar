name: riskradar
x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  environment:
    DATABASE_URL: postgresql://riskradar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/riskradar
    CORS_ORIGINS: http://localhost:5173
    RISKRADAR_API_KEY: ${RISKRADAR_API_KEY:?set RISKRADAR_API_KEY}
  depends_on:
    db: {condition: service_healthy}
  mem_limit: 768m
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: riskradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: riskradar
    volumes: [database:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riskradar -d riskradar']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
  worker:
    <<: *app
    command: ['python', '-m', 'app.platform.worker']
  admin:
    <<: *app
    profiles: [tools]
    entrypoint: ['python', '-m', 'app.platform.admin']
volumes:
  database:
