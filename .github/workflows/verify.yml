name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riskradar
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: riskradar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U riskradar -d riskradar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://riskradar:integration-only@localhost:5432/riskradar_test
      RISKRADAR_TEST_DATABASE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: .:backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=benchmarks/junit.xml
      - run: python -m ml.evaluate --output /tmp/reproduction
      - run: python -m benchmarks.load --events 200 --output benchmarks/postgres-load.json
      - run: python -m benchmarks.recovery --container "${{ job.services.postgres.id }}" --output benchmarks/recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: benchmarks/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
